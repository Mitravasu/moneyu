services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moneyu
      POSTGRES_USER: moneyu
      POSTGRES_PASSWORD: moneyu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyu -d moneyu"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
